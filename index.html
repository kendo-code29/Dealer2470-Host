<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home — dealer2470 Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(.235 .004 180);--fg:oklch(.96 .005 90);--card:oklch(.225 .003 90);--pri:oklch(.74 .135 65);--prif:oklch(.166 .025 170);--sec:oklch(.32 .003 90);--mut:oklch(.7 .003 90);--acc:oklch(.53 .083 199);--des:oklch(.77 .16 20);--bd:oklch(.37 .008 80);--side:oklch(.209 .002 90);--cmd:oklch(.26 .003 90);--ban:oklch(.5 .083 199);--gold:oklch(.8763 .2278 152.55);--qa:oklch(.295 .056 65);
--scene:radial-gradient(ellipse at 12% 16%,color-mix(in oklab,var(--acc) 50%,transparent),transparent 48%),radial-gradient(ellipse at 88% 36%,color-mix(in oklab,var(--pri) 18%,transparent),transparent 42%);
--glow:0 1px 0 color-mix(in oklab,var(--pri) 7%,transparent);
--cshadow:0 0 18px -3px color-mix(in oklab,var(--pri) 65%,transparent),8px 0 18px -8px color-mix(in oklab,var(--des) 80%,transparent);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;border-color:var(--bd)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
::placeholder{color:color-mix(in oklab,var(--mut) 75%,transparent);opacity:1}
::selection{background:var(--acc);color:var(--prif)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{flex:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.mut{color:var(--mut)}.gold{color:var(--gold)}.pri{color:var(--pri)}.acc{color:var(--acc)}.des{color:var(--des)}
.shell{display:flex;min-height:100vh}
aside{display:flex;position:sticky;top:0;height:100vh;width:29%;min-width:256px;max-width:320px;flex:none;flex-direction:column;justify-content:space-between;background:var(--side);overflow-y:auto}
.logo{display:flex;flex-direction:column;align-items:center;padding:20px 24px}
.mark{width:150px;height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 97%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 97%,transparent);mask-composite:intersect}
.x{display:none;margin-left:auto;background:none;border:0;padding:8px}
nav{padding:0 8px}
nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;margin-bottom:4px;border-radius:8px;transition:background .15s}
nav a:hover{background:var(--sec)}nav a.on{background:var(--sec);color:var(--pri)}nav a svg{color:var(--pri)}
.foot{padding:16px}
details summary{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(180deg)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--prif);display:grid;place-items:center;font-size:24px;flex:none}
.sub a{display:block;padding:8px;border-radius:4px;font-size:12px;color:var(--mut)}.sub a:hover{background:var(--sec);color:var(--fg)}
.credit{display:flex;align-items:center;gap:12px;margin-top:8px;padding:16px 0;border-top:1px solid var(--bd);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.credit .ci{width:36px;height:36px;border-radius:50%;background:var(--sec);color:var(--pri);display:grid;place-items:center}
.content{flex:1;min-width:0;overflow:hidden;position:relative;background-image:var(--scene);margin:8px 20px 0 0;border-radius:20px 20px 0 0;min-height:calc(100vh - 8px)}
.banner{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 20px;background:var(--ban);text-align:center}
.banner p{margin:0 auto;max-width:36rem}.banner a{color:var(--pri);text-decoration:underline}
.banner button{background:none;border:0;padding:0;width:24px;height:24px;display:grid;place-items:center}
.mtop{display:none;align-items:center;gap:4px;border-bottom:1px solid var(--bd);padding:12px}
.mtop button{background:none;border:0;width:36px;height:36px;display:grid;place-items:center}
.mtop b{font-size:18px}.mtop b span{color:var(--pri)}
#scrim{display:none}
.home{max-width:1200px;margin:0 auto;padding:36px 56px 40px}
.hd{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:40px}
.escpill{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font-weight:600;background-image:linear-gradient(100deg,color-mix(in oklab,var(--acc) 55%,var(--card)),color-mix(in oklab,var(--pri) 35%,var(--card)));box-shadow:var(--cshadow)}
.escpill svg{color:var(--pri)}
h1{font-size:30px;line-height:1.25;font-weight:700;margin:0}
.hd h1{margin-top:64px}
.cmd{border:2px solid var(--pri);border-radius:32px;background:var(--cmd);padding:20px 24px;box-shadow:var(--cshadow)}
.cmd input{width:100%;min-width:0;background:none;border:0;padding:8px 0;outline:0}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.ibtn{background:none;border:0;width:28px;height:28px;display:grid;place-items:center;border-radius:6px}.ibtn:hover{background:var(--sec)}
.selw{position:relative}.selw select{appearance:none;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--sec);padding:0 32px 0 12px;font-size:14px;font-weight:600}
.selw svg{position:absolute;right:8px;top:9px;pointer-events:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:999px;background:var(--qa);border:1px solid color-mix(in oklab,var(--pri) 55%,var(--bd));font-size:14px;font-weight:500}
.pill:hover{background:var(--sec)}.pill svg{color:var(--pri)}
.h2s{font-size:16px;font-weight:600;margin:24px 0 12px}.h2s span{font-size:14px;font-weight:400;color:var(--mut)}
.feed{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sug{width:128px;flex:none;border:1px solid var(--bd);border-radius:16px;background:var(--card);padding:6px;transition:border-color .15s}
.sug:hover{border-color:color-mix(in oklab,var(--pri) 60%,transparent)}
.ph{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:center;font-size:40px;width:100%}
.sug h3{font-size:12px;line-height:16px;font-weight:500;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px 2px;font-size:12px;font-weight:500}
.vb{height:24px;border-radius:6px;padding:0 10px;font-size:12px;background:var(--sec);border:0}
.page{max-width:72rem;margin:0 auto;padding:32px 40px}
.page h1{margin-bottom:24px}
.panel{border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:20px;box-shadow:var(--glow);min-width:0}
.panel>h2{margin:0 0 16px;font:400 12px "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--mut)}
.stat{min-width:0;overflow:hidden;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:16px;box-shadow:var(--glow)}
.stat div:first-child{font:400 12px "IBM Plex Mono",monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat div:last-child{margin-top:4px;font-size:24px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g3{display:grid;gap:16px;grid-template-columns:repeat(3,1fr);margin-bottom:24px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
.gc{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--bd);padding:10px 0;font-size:14px}.row:last-child{border:0}
.row .r{text-align:right}.row small{font:400 12px "IBM Plex Mono",monospace;color:var(--mut)}
.ebadge{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in oklab,var(--acc) 60%,transparent);background:color-mix(in oklab,var(--acc) 10%,transparent);color:var(--acc);border-radius:999px;font:400 10px "IBM Plex Mono",monospace;padding:2px 8px}
.tier{border:1px solid;border-radius:4px;padding:2px 6px;font:400 10px "IBM Plex Mono",monospace;color:var(--acc);white-space:nowrap}
.t3{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 15%,transparent)}.t2{border-color:color-mix(in oklab,var(--acc) 50%,transparent)}.t1{border-color:color-mix(in oklab,var(--acc) 30%,transparent);opacity:.85}
.b{white-space:nowrap;border:0;border-radius:6px;background:var(--sec);padding:4px 12px;font-size:12px}.b:hover{background:var(--bd)}
.b.p{background:var(--pri);color:var(--prif);font-weight:600;transition:background .15s}.b.p:hover{background:var(--gold)}.b.p:disabled{opacity:.4;cursor:default}
.b.a{background:var(--acc);color:var(--prif);font-weight:600}
.b.d{background:color-mix(in oklab,var(--des) 15%,transparent);border:1px solid color-mix(in oklab,var(--des) 50%,transparent);color:var(--des)}
.cat{border:0;border-radius:999px;padding:4px 12px;font-size:12px;background:var(--sec);display:flex;gap:6px;align-items:center}.cat.on{background:var(--acc);color:var(--prif)}.cat i{font-style:normal;opacity:.6}
.inp{border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:8px 12px;font-size:14px;min-width:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);padding:0 12px;margin-bottom:16px}.search input{flex:1;min-width:0;background:none;border:0;padding:8px 0;outline:0;font-size:14px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
.lc{display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:16px;box-shadow:var(--glow);min-width:0}.lc:hover{border-color:color-mix(in oklab,var(--acc) 60%,transparent)}
.lc h3{font-size:18px;line-height:1.35;font-weight:600;margin:0}
.lc .ph{aspect-ratio:16/9;font-size:44px}.lc .sp{flex-wrap:wrap}
.s2{grid-column:span 2;min-width:0}.xs{font-size:12px}.sp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.frm .full{grid-column:1/-1}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:3px;background:var(--sec);border-radius:2px}.steps i.d{background:var(--acc)}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.works .ph{aspect-ratio:1;font-size:26px;position:relative}.works small{position:absolute;left:4px;bottom:3px;font-size:10px;background:#0009;border-radius:4px;padding:0 4px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{height:224px;overflow-y:auto;background:var(--bg);border-radius:4px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.chat p{margin:0;max-width:80%;border-radius:8px;padding:8px 12px;font-size:14px;background:var(--sec)}.chat p.me{align-self:flex-end;background:var(--pri);color:var(--prif)}
.esc{margin-top:16px;border:1px solid color-mix(in oklab,var(--acc) 40%,transparent);background:color-mix(in oklab,var(--acc) 5%,transparent);border-radius:8px;padding:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--prif);font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#toast.on{opacity:1}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--pri);border-radius:12px;padding:20px;width:min(420px,92vw)}dialog::backdrop{background:#000a}
.content{display:flex;flex-direction:column}
.auth{display:grid;place-items:center;padding:40px 20px}.authp{width:min(440px,100%)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:8px;padding:4px}.tabs button{border:0;background:none;border-radius:6px;padding:8px;font-weight:500}.tabs .on{background:var(--sec);color:var(--pri)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-bottom:12px}.fl .inp{width:100%;padding:10px 12px}
.pw{display:flex;gap:8px}.pw .inp{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:8px 0}.chk input{margin-top:3px}
.err{color:var(--des);font-size:13px;margin:0 0 12px;min-height:0}
.bw{width:100%;padding:10px;font-size:15px}
.link{background:none;border:0;color:var(--pri);padding:0;text-decoration:underline;font-size:13px}
footer{border-top:1px solid var(--bd);background:color-mix(in oklab,var(--side) 80%,transparent);margin-top:40px}
.ftin{max-width:72rem;margin:0 auto;padding:32px 40px 24px}
.ftc{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:24px}
.ftc a{display:block;padding:4px 0;font-size:14px;color:var(--mut)}.ftc a:hover{color:var(--pri)}
.ftc h3{margin:0 0 8px;font:400 12px "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--mut)}
.fth{font-size:20px}
.ftb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);margin-top:24px;padding-top:16px;font-size:12px;color:var(--mut)}
.info{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}.il a{display:block;padding:8px 12px;border-radius:6px;font-size:14px}.il a.on{background:var(--sec);color:var(--pri)}.il a:hover{background:var(--sec)}
.prose h2{font-size:18px;margin:0 0 12px}.prose p,.prose li{font-size:14px;line-height:1.65}.prose details{border-bottom:1px solid var(--bd);padding:10px 0}.prose summary{cursor:pointer;font-weight:500}
.draft{font-size:12px;color:var(--pri);border:1px solid color-mix(in oklab,var(--pri) 50%,transparent);border-radius:6px;padding:6px 10px;margin-bottom:12px}
#ck{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;width:calc(100% - 32px);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;z-index:55;box-shadow:0 8px 30px #000a;font-size:13px}
.signin{display:flex;align-items:center;gap:12px;padding:12px 0}
.authbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-bottom:20px}
.ab{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid color-mix(in oklab,var(--pri) 55%,var(--bd));white-space:nowrap;transition:background .15s}
.ab.g:hover{background:var(--qa)}.ab.p{background:var(--pri);color:var(--prif);border-color:var(--pri);box-shadow:0 0 16px -4px color-mix(in oklab,var(--pri) 70%,transparent)}.ab.p:hover{background:var(--gold);border-color:var(--gold)}
@media(max-width:1100px){.cards,.gc{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){
.mtop{display:flex}
aside{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 20px 40px #000a;padding-top:env(safe-area-inset-top,0px)}
aside.open{transform:none}
.x{display:block}
#scrim{display:block;position:fixed;inset:0;background:#0008;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.on{opacity:1;pointer-events:auto}
.content{margin:0;border-radius:0;min-height:100vh}
.home{padding:36px 20px 40px}.page{padding:32px 20px}
.g3,.g2,.gc,.cards{grid-template-columns:1fr}.s2{grid-column:auto}
.hd h1{margin-top:64px}
.authbar{display:none}.mtop .ab{height:34px;padding:0 12px;font-size:13px}
.ftc{grid-template-columns:1fr 1fr}.ftc>div:first-child{grid-column:1/-1}.ftin{padding:24px 20px}.info{grid-template-columns:1fr}.il{display:flex;flex-wrap:wrap;gap:4px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

nsaction</button>`}</div>`:""}`)}</div></div>`)},

const nm=em.split("@")[0];S.user={name:su?String(f.get("name")).trim():nm[0].toUpperCase()+nm.slice(1),email:em,role:su?String(f.get("role")):"Buyer"};

toast(su?"Account created. Welcome!":"Signed in");const n=S.next||"home";S.next=null;go(n);render()}
